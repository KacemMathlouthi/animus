<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link href="/logo.svg" rel="icon" type="image/svg+xml">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <!-- The hero's accent words use this face; without a preload the request
         only starts after the CSS bundle parses, so they visibly swap in. -->
    <link
      as="font"
      crossorigin
      href="/fonts/GeistPixel-Grid.woff2"
      rel="preload"
      type="font/woff2"
    >
    <!-- The app defaults to dark; without this, mobile browser chrome renders light against a dark page. -->
    <meta content="#0b0a0a" name="theme-color">
    <!-- share-meta:start -->
    <title>animus — Turn any question into a video that makes it click</title>
    <meta
      content="animus turns any question into a narrated, animated explainer video, so the idea actually clicks and stays."
      name="description"
    >
    <!-- Inside the share-meta markers on purpose: injectShareMeta replaces this whole block for /v/:token, so a share page can never inherit the homepage's canonical. -->
    <link href="https://tryanimus.app/" rel="canonical">

    <!-- Open Graph -->
    <meta content="website" property="og:type">
    <meta content="animus" property="og:site_name">
    <meta
      content="animus — Turn any question into a video that makes it click"
      property="og:title"
    >
    <meta
      content="animus turns any question into a narrated, animated explainer video, so the idea actually clicks and stays."
      property="og:description"
    >
    <meta content="https://tryanimus.app/" property="og:url">
    <meta content="https://tryanimus.app/og.png" property="og:image">
    <meta content="1200" property="og:image:width">
    <meta content="630" property="og:image:height">
    <meta content="image/png" property="og:image:type">

    <!-- Twitter -->
    <meta content="summary_large_image" name="twitter:card">
    <meta
      content="animus — Turn any question into a video that makes it click"
      name="twitter:title"
    >
    <meta
      content="animus turns any question into a narrated, animated explainer video, so the idea actually clicks and stays."
      name="twitter:description"
    >
    <meta content="https://tryanimus.app/og.png" name="twitter:image">
    <!-- share-meta:end -->
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
