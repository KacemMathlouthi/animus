<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The hero's accent words use this face; without a preload the request
         only starts after the CSS bundle parses, so they visibly swap in. -->
    <link
      rel="preload"
      href="/fonts/GeistPixel-Grid.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The app defaults to dark; without this, mobile browser chrome renders light against a dark page. -->
    <meta name="theme-color" content="#0b0a0a" />
    <!-- share-meta:start -->
    <title>animus — Turn any question into a video that makes it click</title>
    <meta
      name="description"
      content="animus turns any question into a narrated, animated explainer video, so the idea actually clicks and stays."
    />
    <!-- Inside the share-meta markers on purpose: injectShareMeta replaces this whole block for /v/:token, so a share page can never inherit the homepage's canonical. -->
    <link rel="canonical" href="https://tryanimus.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="animus" />
    <meta
      property="og:title"
      content="animus — Turn any question into a video that makes it click"
    />
    <meta
      property="og:description"
      content="animus turns any question into a narrated, animated explainer video, so the idea actually clicks and stays."
    />
    <meta property="og:url" content="https://tryanimus.app/" />
    <meta property="og:image" content="https://tryanimus.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="animus — Turn any question into a video that makes it click"
    />
    <meta
      name="twitter:description"
      content="animus turns any question into a narrated, animated explainer video, so the idea actually clicks and stays."
    />
    <meta name="twitter:image" content="https://tryanimus.app/og.png" />
    <!-- share-meta:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
