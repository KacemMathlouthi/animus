<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!--
      Source for .github/social-preview.jpg — the repository's social preview
      card (Settings → General → Social preview on GitHub).

      The plate beside this file, github-og-painting.jpg, is the card's artwork.
      Both live in tracked directories on purpose: docs/ and /assets are ignored
      as whole directories, so a card kept there would silently never be
      committed and could not be re-rendered from a fresh clone.

      The body is exactly 1280x640 and anchored top-left. Render it from this
      directory with:

        google-chrome-stable --headless --window-size=1280,900 \
          --hide-scrollbars --screenshot=/tmp/og-raw.png github-og.html
        python3 -c "from PIL import Image; \
          Image.open('/tmp/og-raw.png').convert('RGB').crop((0,0,1280,640)).save( \
          '../.github/social-preview.jpg', quality=92, subsampling='4:2:0', \
          optimize=True)"

      Three things about that pipeline are deliberate:

      Shoot tall and crop, rather than passing --window-size=1280,640 directly.
      Chrome's new headless reserves ~60px of the window for viewport chrome, so
      asking for the exact size silently clips the bottom of the card (it cost
      one render to find). Cropping the top-left 1280x640 off a taller shot is
      exact, because the body is a fixed box at the origin.

      JPEG, not PNG. GitHub rejects social previews over 1MB, and a 1280x640
      PNG of an oil painting lands around 1.2MB at any compression level — the
      content is photographic, so PNG is the wrong container for it. The JPEG is
      ~155KB with no visible loss on the type.

      Pillow for the JPEG, not ffmpeg. `ffmpeg -q:v 2` writes a technically valid
      but unusual file: no APP0/JFIF header (an encoder COM string sits where it
      belongs), 4:4:4 chroma, full-range yuvj444p. GitHub accepted that upload —
      the asset record was created and the repo meta updated — but its image
      pipeline never published the blob to the CDN, so og:image 404'd
      indefinitely while the object sat readable in S3. Pillow writes a textbook
      baseline JPEG (APP0 JFIF, 4:2:0), which is what GitHub expects. If a future
      upload 404s the same way, check `xxd -l 4` for `ffd8 ffe0` first.

      1280x640 is GitHub's recommended social-preview size (it accepts down to
      640x320).

      Kept in the repo because an OG card is the one asset nobody notices has
      gone stale until it is already being shared.
    -->
    <style>
    @font-face {
      font-family: "Geist";
      src: url("../apps/web/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2")
        format("woff2");
      font-weight: 100 900;
    }

    /* The hero's accent face — the same one the landing page sets
                       "QUESTION" and "VIDEO" in, so the card and the site read as one voice. */
    @font-face {
      font-family: "Geist Pixel Grid";
      src: url("../apps/web/public/fonts/GeistPixel-Grid.woff2") format("woff2");
      font-weight: 100 900;
    }

    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      position: relative;
      width: 1280px;
      height: 640px;
      overflow: hidden;
      font-family: "Geist", system-ui, sans-serif;
      color: #f5efe6;
      /* --color-base, the app's dark ground. */
      background: #0b0a0a;
    }

    /* The painting is the ground, not the message: it sits behind a scrim so
                       the type stays the thing you read first.

                       Sized well below `cover` and anchored right. `cover` is the smallest scale
                       that fills a 2:1 frame from a 4:3 plate, and it throws away a third of the
                       painting's height — the sea, the valley and the flowers all fall outside
                       the crop. Holding it at 1050px shows nearly all of the composition; the
                       left edge then stops short of the frame, so it is masked out into the dark
                       ground rather than cut, which is where the type sits anyway. */
    .art {
      position: absolute;
      inset: 0;
      background:
        url("./github-og-painting.jpg") right 34% / 1050px auto no-repeat;
      -webkit-mask-image: linear-gradient(
        to right,
        transparent 230px,
        #000 620px
      );
      mask-image: linear-gradient(to right, transparent 230px, #000 620px);
    }

    /* Darkest at the left, where the words are; the figure on the right keeps
                       its contrast. Warm-black rather than neutral, so the scrim sinks into
                       the painting's own shadow tones instead of greying them. */
    .scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        rgba(11, 10, 10, 0.94) 0%,
        rgba(11, 10, 10, 0.82) 34%,
        rgba(11, 10, 10, 0.34) 62%,
        rgba(11, 10, 10, 0) 100%
      );
    }

    .content {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      max-width: 820px;
      height: 100%;
      padding: 76px 80px;
    }

    .brand {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .brand svg {
      width: 46px;
      height: 46px;
    }

    .wordmark {
      font-size: 42px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    h1 {
      font-size: 66px;
      font-weight: 500;
      line-height: 1.06;
      letter-spacing: -0.035em;
    }

    /* Matches the landing hero: "question" set italic, "video" set bold, both
                       uppercase in the pixel face. */
    h1 .accent {
      font-family: "Geist Pixel Grid", "Geist", sans-serif;
      text-transform: uppercase;
    }

    /* The landing page pulls this word left with a negative margin, tuned for
                       its own measure. Here that closes the space against "any" entirely, so
                       the accent keeps a normal word space and only the italic's trailing
                       sidebearing is padded back. */
    h1 .accent-question {
      padding-right: 0.06em;
      font-style: italic;
    }

    h1 .accent-video {
      font-weight: 700;
    }

    h1 .line-two {
      font-size: 0.9em;
    }

    .tagline {
      margin-top: 26px;
      font-size: 24px;
      font-weight: 400;
      /* --color-muted, the same grey "Made with animus" uses on the share card. */
      color: #9a8f80;
      letter-spacing: -0.015em;
    }

    .url {
      font-size: 27px;
      font-weight: 500;
      color: #f5efe6;
      letter-spacing: -0.015em;
    }
    </style>
  </head>
  <body>
    <div class="art"></div>
    <div class="scrim"></div>

    <div class="content">
      <div class="brand">
        <!-- Paths lifted from apps/web/public/logo.svg (viewBox "25 19 70 93").
             The eyes are filled with the page ground so the mark reads the same
             way it does in the app. -->
        <svg viewBox="25 19 70 93" xmlns="http://www.w3.org/2000/svg">
          <title>animus</title>
          <defs>
            <linearGradient id="body" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0" stop-color="#e7b277" />
              <stop offset="1" stop-color="#7a4717" />
            </linearGradient>
          </defs>
          <path
            d="M28 64 C28 38 42 22 60 22 C78 22 92 38 92 64 L92 104 C92 111 80 111 76 104 Q68 114 60 104 Q52 114 44 104 C40 111 28 111 28 104 Z"
            fill="url(#body)"
          />
          <g fill="#0b0a0a" transform="translate(5.2 -11.2) scale(0.6)">
            <path
              d="m74.6 97.4h0.2c3.2 0 5.6 2.6 5.6 5.8l0.1 17.9c-0.1 3.1-2.4 5.9-5.9 6-2.9-0.1-5.7-2.1-5.7-6.2v-17.9c0-3.1 2.5-5.6 5.7-5.6z"
            />
            <path
              d="m105.4 97.4h0.1c3 0 5.7 2.5 5.7 5.8v17.8c0 3-2.5 6.1-6 6.1-2.8-0.1-5.7-2.3-5.8-6.1v-18c0.2-3.1 2.6-5.6 6-5.6z"
            />
          </g>
        </svg>
        <span class="wordmark">animus</span>
      </div>

      <div>
        <h1>
          <span class="line-one"
            >Turn any <span class="accent accent-question">question</span></span
          ><br>
          <span class="line-two"
            >into an explainer
            <span class="accent accent-video">video</span></span
          >
        </h1>
        <div class="tagline">
          Narrated, research-grounded explainers, built with Manim.
        </div>
      </div>

      <div class="url">tryanimus.app</div>
    </div>
  </body>
</html>
