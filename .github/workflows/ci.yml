name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  ci:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      # Run every check even if one fails, so the PR shows all results at once.
      fail-fast: false
      matrix:
        # Each entry is a root script (see package.json):
        #   typecheck -> turbo tsc, check -> ultracite (lint+format),
        #   knip -> dead code/deps, test -> turbo vitest, build -> web build.
        task: [typecheck, check, knip, test, build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache dependencies and Turbo
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-deps-${{ hashFiles('bun.lock') }}-${{ matrix.task }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-deps-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.task }}
        run: bun run ${{ matrix.task }}

  # Report-only coverage across the whole monorepo (web included at 0% until it
  # has tests). No thresholds — this never fails the build, it just posts the
  # numbers to the job summary and a PR comment.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Cache dependencies and Turbo
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-deps-${{ hashFiles('bun.lock') }}-coverage
          restore-keys: |
            ${{ runner.os }}-deps-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-deps-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run coverage
        run: bun run test:coverage

      - name: Build per-workspace coverage report
        if: ${{ !cancelled() }}
        run: bun scripts/coverage-report.ts | tee coverage/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: coverage/report.md
